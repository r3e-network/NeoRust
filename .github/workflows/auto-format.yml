name: Auto Format

on:
  push:
    branches: [ master, develop ]

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt
    - run: cargo fmt
    - uses: stefanzweifel/git-auto-commit-action@v5
      with:
        commit_message: "chore: auto-format code"
