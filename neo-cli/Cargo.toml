[package]
name = "neo-cli"
version = "1.0.7"
edition = "2021"
description = "Command-line interface for the NeoRust SDK"
authors = ["R3E Network (c) 2020-2025"]
license = "MIT"
documentation = "https://docs.rs/neo-cli"
repository = "https://github.com/R3E-Network/NeoRust"
homepage = "https://github.com/R3E-Network/NeoRust"
readme = "README.md"

[[bin]]
name = "neo-cli"
path = "src/main.rs"

[features]
default = ["network", "fs", "storage", "files", "neofs"]
network = []
fs = []
storage = []
files = []
neofs = []

[dependencies]
neo3 = { path = "..", version = "1.0.7", features = ["futures", "ledger", "ws"] }
tokio = { version = "1.45", features = ["full"] }
clap = { version = "4.0", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
colored = "2.0"
comfy-table = "7.0"
dirs = "5.0"
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.22.1"
hex = "0.4"
rand = "0.8"
url = "2.4"
dialoguer = "0.11"
anyhow = "1.0"
thiserror = "2.0.17"
primitive-types = "0.13"
num-traits = "0.2"
reqwest = { version = "0.12", features = ["json"] }
sha2 = "0.10"
ripemd = "0.1"
env_logger = "0.11.6"
log = "0.4"
mime_guess = "2.0"
uuid = { version = "1.6", features = ["v4"] }
aes-gcm = "0.10"
bip39 = { version = "2.1", default-features = false, features = ["std", "rand"] }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "2.11.0"

[dev-dependencies]
tempfile = "3.10.0"
assert_cmd = "2.0.13"
predicates = "3.1.0"
