# NFT Collection Template (NEP-11)
# Starter for building an NFT collection dApp.

[template]
name = "nft-collection"
description = "NEP-11 NFT collection starter"
version = "1.0.6"
author = "NeoRust Team"

[files]
"src/main.rs" = '''
//! NFT Collection dApp starter (NEP-11)
//!
//! This template demonstrates:
//! - Connecting to Neo TestNet
//! - Basic project structure for an NFT collection app
//! - Loading an on-chain NEP-11 contract hash from configuration

use neo3::neo_types::ScriptHash;
use neo3::sdk::Neo;
use std::error::Error;
use std::str::FromStr;

#[tokio::main]
async fn main() -> Result<(), Box<dyn Error>> {
    println!("🖼️  NFT Collection Scaffold");

    // Connect to Neo TestNet
    let neo = Neo::testnet().await?;
    let height = neo.get_block_height().await?;
    println!("✅ Connected (height = {})", height);

    let contract_hash = std::env::var("NEP11_CONTRACT_HASH")
        .expect("set NEP11_CONTRACT_HASH to an existing NEP-11 contract script hash");
    let contract = ScriptHash::from_str(&contract_hash)?;
    println!("📦 NFT contract: {:?}", contract);

    Ok(())
}
'''

"Cargo.toml" = '''
[package]
name = "{{project_name}}"
version = "0.1.0"
edition = "2021"

[dependencies]
neo3 = "{{neo3_version}}"
tokio = { version = "1.45", features = ["full"] }
anyhow = "1.0"
'''

"README.md" = '''
# {{project_name}} - NFT Collection Starter (NEP-11)

NFT collection starter built with NeoRust SDK v{{neo3_version}}.

## Next Steps

- Implement NEP-11 contract deployment (see `contracts/nft.py`)
- Add read-only calls (balance / tokensOf / properties) via `neo3`
- Add transaction signing + mint/transfer flows
'''

"contracts/nft.py" = '''
"""
NEP-11 NFT Contract Entry Point (Neo N3 / boa3)

Use this file for your audited NEP-11 contract implementation. The generated
Rust client expects a deployed contract hash in NEP11_CONTRACT_HASH.
"""
'''
