"README.md" = '''
# {{project_name}} - NEP-17 Token

A NEP-17 compliant fungible token implementation using NeoRust SDK v{{neo3_version}}.

## Features

- ✅ NEP-17 standard compliance
- ✅ Token transfers
- ✅ Balance queries
- ✅ Total supply management
- ✅ Event emission

## Smart Contract

The `contracts/token.py` file contains the NEP-17 token smart contract written in Python for neo3-boa.

### Compiling the Contract

1. Install neo3-boa:
   ```bash
   pip install neo3-boa
   ```

2. Compile the contract:
   ```bash
   neo3-boa contracts/token.py
   ```

3. Deploy to TestNet:
   ```bash
   neo-cli contract deploy contracts/token.nef contracts/token.manifest.json
   ```

## Token Management

### Check Balance
```bash
cargo run -- balance <address>
```

### Transfer Tokens
```bash
cargo run -- transfer <from> <to> <amount>
```

### Get Token Info
```bash
cargo run -- info
```

## Configuration

Update the token contract hash in `src/main.rs` after deployment.

## Testing

```bash
cargo test
```

