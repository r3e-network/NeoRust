# NFT Collection Template (NEP-11)
# Scaffold for building an NFT collection dApp + contract stub.

[template]
name = "nft-collection"
description = "NEP-11 NFT collection scaffold (dApp + contract stub)"
version = "1.0.3"
author = "NeoRust Team"

[files]
"src/main.rs" = '''
//! NFT Collection dApp scaffold (NEP-11)
//!
//! This template demonstrates:
//! - Connecting to Neo TestNet
//! - Basic project structure for an NFT collection app
//! - Placeholder for interacting with an on-chain NEP-11 contract

use neo3::neo_types::ScriptHash;
use neo3::sdk::Neo;
use std::error::Error;
use std::str::FromStr;

#[tokio::main]
async fn main() -> Result<(), Box<dyn Error>> {
    println!("🖼️  NFT Collection Scaffold");

    // Connect to Neo TestNet
    let neo = Neo::testnet().await?;
    let height = neo.get_block_height().await?;
    println!("✅ Connected (height = {})", height);

    // Replace with your NEP-11 contract hash
    let contract = ScriptHash::from_str("0x...").unwrap_or_default();
    println!("📦 NFT contract (placeholder): {:?}", contract);

    Ok(())
}
'''

"Cargo.toml" = '''
[package]
name = "{{project_name}}"
version = "0.1.0"
edition = "2021"

[dependencies]
neo3 = "{{neo3_version}}"
tokio = { version = "1.45", features = ["full"] }
anyhow = "1.0"
'''

"README.md" = '''
# {{project_name}} - NFT Collection (NEP-11)

NFT collection scaffold built with NeoRust SDK v{{neo3_version}}.

## Next Steps

- Implement NEP-11 contract deployment (see `contracts/nft.py`)
- Add read-only calls (balance / tokensOf / properties) via `neo3`
- Add transaction signing + mint/transfer flows
'''

"contracts/nft.py" = '''
"""
NEP-11 NFT Contract Stub (Neo N3 / boa3)

This is a minimal placeholder contract to show where NFT smart-contract code would live.
Replace with a full NEP-11 implementation using neo3-boa.
"""
'''
