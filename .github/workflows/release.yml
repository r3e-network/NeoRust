name: Release

on:
  push:
    tags:
      - "v*.*.*"

# Cancel in-progress runs when a new run is triggered
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  # Validate and prepare release
  prepare:
    name: Prepare Release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate release tag
        id: version
        run: |
          if [ "$GITHUB_EVENT_NAME" != "push" ] || [ "$GITHUB_REF_TYPE" != "tag" ]; then
            echo "Error: releases must be triggered by a pushed version tag"
            exit 1
          fi

          VERSION="$GITHUB_REF_NAME"
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Error: release version must be valid v-prefixed SemVer"
            exit 1
          fi

          if ! git cat-file -e "refs/tags/${VERSION}^{tag}" 2>/dev/null; then
            echo "Error: ${VERSION} must be an annotated tag"
            exit 1
          fi

          TAG_COMMIT="$(git rev-parse "refs/tags/${VERSION}^{commit}")"
          CHECKOUT_COMMIT="$(git rev-parse HEAD)"
          EVENT_COMMIT="$(git rev-parse "${GITHUB_SHA}^{commit}")"
          if [ "$TAG_COMMIT" != "$CHECKOUT_COMMIT" ] || [ "$TAG_COMMIT" != "$EVENT_COMMIT" ]; then
            echo "Error: release tag, workflow event, and checkout do not resolve to the same commit"
            exit 1
          fi

          git fetch --no-tags origin master:refs/remotes/origin/master
          if ! git merge-base --is-ancestor "$TAG_COMMIT" refs/remotes/origin/master; then
            echo "Error: release tag commit must be reachable from origin/master"
            exit 1
          fi

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Version: ${VERSION}"

      - name: Verify Cargo.toml version
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          VERSION_NUM="${VERSION#v}"
          CARGO_VERSION="v$(grep '^version' Cargo.toml | head -1 | cut -d'"' -f2)"
          if [ "$VERSION" != "$CARGO_VERSION" ]; then
            echo "Error: Tag version ($VERSION) doesn't match Cargo.toml version ($CARGO_VERSION)"
            exit 1
          fi

          CLI_VERSION="$(grep '^version' neo-cli/Cargo.toml | head -1 | cut -d'"' -f2)"
          if [ "$VERSION_NUM" != "$CLI_VERSION" ]; then
            echo "Error: neo-cli version ($CLI_VERSION) doesn't match release version ($VERSION_NUM)"
            exit 1
          fi

          EXPECTED_CLI_DEPENDENCY="neo3 = { path = \"..\", version = \"${VERSION_NUM}\""
          if ! grep -Fq "$EXPECTED_CLI_DEPENDENCY" neo-cli/Cargo.toml; then
            echo "Error: neo-cli must require neo3 ${VERSION_NUM}"
            exit 1
          fi

          LOCK_NEO3_VERSION="$(awk '/^name = "neo3"$/ { getline; gsub(/"/, "", $3); print $3; exit }' Cargo.lock)"
          LOCK_CLI_VERSION="$(awk '/^name = "neo-cli"$/ { getline; gsub(/"/, "", $3); print $3; exit }' Cargo.lock)"
          if [ "$LOCK_NEO3_VERSION" != "$VERSION_NUM" ] || [ "$LOCK_CLI_VERSION" != "$VERSION_NUM" ]; then
            echo "Error: Cargo.lock package versions ($LOCK_NEO3_VERSION, $LOCK_CLI_VERSION) don't match $VERSION_NUM"
            exit 1
          fi

          if ! grep -q "^## \[${VERSION_NUM}\] - " CHANGELOG.md; then
            echo "Error: CHANGELOG.md has no dated ${VERSION_NUM} release section"
            exit 1
          fi

      - name: Verify locked workspace metadata
        run: cargo metadata --locked --no-deps --format-version 1 > /dev/null

  verify:
    name: Verify Release Candidate
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust 1.91
        uses: dtolnay/rust-toolchain@1.91
        with:
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --workspace --locked --all-features --all-targets -- -D warnings

      - name: Run workspace tests
        run: cargo test --workspace --locked

      - name: Build API documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc -p neo3 --locked --all-features --no-deps

      - name: Audit dependencies
        uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check supply-chain policy
        uses: EmbarkStudios/cargo-deny-action@v2

  # Build release artifacts
  build:
    name: Build - ${{ matrix.os }}
    needs: prepare
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: neorust-linux-amd64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: neorust-windows-amd64
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: neorust-macos-amd64

    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        run: |
          cargo build --release --locked --target ${{ matrix.target }} --no-default-features --workspace
          cargo build --release --locked --target ${{ matrix.target }} -p neo-cli --bin neo-cli

      - name: Package artifacts (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          if [ -f target/${{ matrix.target }}/release/neo-cli ]; then
            cp target/${{ matrix.target }}/release/neo-cli dist/
          fi
          cp README.md LICENSE CHANGELOG.md dist/
          tar -czf ${{ matrix.artifact }}.tar.gz -C dist .

      - name: Package artifacts (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          if (Test-Path target\${{ matrix.target }}\release\neo-cli.exe) {
            Copy-Item target\${{ matrix.target }}\release\neo-cli.exe dist\
          }
          Copy-Item README.md, LICENSE, CHANGELOG.md dist\
          Compress-Archive -Path dist\* -DestinationPath ${{ matrix.artifact }}.zip

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            *.tar.gz
            *.zip

  # Create GitHub release
  release:
    name: Create GitHub Release
    needs: [prepare, build, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v6
        with:
          path: artifacts

      - name: Extract release notes
        id: release-notes
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          VERSION_NUM="${VERSION#v}"

          # Extract release notes from CHANGELOG.md
          awk "/## \[${VERSION_NUM}\]/{flag=1; next} /## \[/{flag=0} flag" CHANGELOG.md > release-notes.md

          # If no specific notes found, use a default message
          if [ ! -s release-notes.md ]; then
            echo "Release ${VERSION}" > release-notes.md
            echo "" >> release-notes.md
            echo "See [CHANGELOG.md](CHANGELOG.md) for details." >> release-notes.md
          fi

          echo "Release notes:"
          cat release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.version }}
          name: NeoRust ${{ needs.prepare.outputs.version }}
          body_path: release-notes.md
          draft: false
          prerelease: ${{ contains(needs.prepare.outputs.version, '-') }}
          files: |
            artifacts/**/*.tar.gz
            artifacts/**/*.zip
          token: ${{ secrets.GITHUB_TOKEN }}

  # Publish crate
  publish:
    name: Publish neo3 crate
    needs: [prepare, build, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Accept both repository secret names, but expose the token through the
      # environment variable Cargo uses for crates.io authentication.
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_TOKEN || secrets.CRATES_IO_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Check crates.io publication
        id: crates
        shell: bash
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          VERSION_NUM="${VERSION#v}"

          if cargo search neo3 --limit 1 | grep -q "^neo3 = \"${VERSION_NUM}\""; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "neo3 ${VERSION_NUM} is already published on crates.io."
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
            echo "neo3 ${VERSION_NUM} is not published on crates.io."
          fi

      - name: Verify package
        if: steps.crates.outputs.published != 'true'
        run: cargo publish --dry-run --locked -p neo3

      - name: Publish to crates.io
        if: steps.crates.outputs.published != 'true' && env.CARGO_REGISTRY_TOKEN != ''
        run: cargo publish --locked -p neo3

      - name: Require crates.io token
        if: steps.crates.outputs.published != 'true' && env.CARGO_REGISTRY_TOKEN == ''
        run: |
          echo "CARGO_TOKEN or CRATES_IO_TOKEN must be configured to publish this release."
          exit 1

      - name: Skip already published crate
        if: steps.crates.outputs.published == 'true'
        run: |
          echo "neo3 ${{ needs.prepare.outputs.version }} is already published; skipping crates.io publish."
