//! NEP-17 Token Management dApp
//! 
//! This application provides:
//! - Token deployment
//! - Transfer operations
//! - Balance checking
//! - Token administration

use neo3::sdk::Neo;
use neo3::neo_types::ScriptHash;
use std::error::Error;
use std::str::FromStr;

mod token;
use token::Nep17Token;

#[tokio::main]
